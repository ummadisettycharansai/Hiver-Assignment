<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hiver — Golden Set Annotation Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── DESIGN TOKENS ──────────────────────────────────────────── */
    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface2:    #1c2230;
      --border:      #30363d;
      --border-l:    #3d4450;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --text-dim:    #6e7681;
      --accent:      #58a6ff;
      --accent-glow: rgba(88,166,255,.18);
      --green:       #3fb950;
      --green-d:     rgba(63,185,80,.15);
      --yellow:      #d29922;
      --yellow-d:    rgba(210,153,34,.15);
      --red:         #f85149;
      --red-d:       rgba(248,81,73,.15);
      --purple:      #a371f7;
      --purple-d:    rgba(163,113,247,.15);
      --radius:      10px;
      --shadow:      0 4px 24px rgba(0,0,0,.45);
    }

    /* ── RESET ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent); text-decoration: none; }
    button { cursor: pointer; font-family: inherit; border: none; outline: none; }

    /* ── TOP HEADER ─────────────────────────────────────────────── */
    #header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(8px);
    }
    #header .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #header .logo .badge {
      background: var(--accent);
      color: #fff;
      font-size: .65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: .05em;
    }
    #progress-bar-wrap {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #58a6ff, #a371f7);
      border-radius: 99px;
      transition: width .4s ease;
      width: 0%;
    }
    #progress-label {
      font-size: .8rem;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 80px;
      text-align: right;
    }
    #header-actions { display: flex; gap: 8px; }
    .btn-small {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: .78rem;
      font-weight: 500;
      transition: background .15s, border-color .15s;
    }
    .btn-small:hover { background: var(--border); border-color: var(--border-l); }
    .btn-small.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d1117;
    }
    .btn-small.accent:hover { filter: brightness(1.1); }

    /* ── LAYOUT ─────────────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-columns: 280px 1fr 260px;
      gap: 0;
      flex: 1;
      min-height: 0;
    }

    /* ── LEFT SIDEBAR — EXAMPLE LIST ────────────────────────────── */
    #sidebar {
      border-right: 1px solid var(--border);
      background: var(--surface);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    #sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #sidebar-header h3 { font-size: .82rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; flex: 1; }
    #filter-bar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      font-size: .72rem;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      transition: all .15s;
    }
    .filter-btn.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    #example-list { flex: 1; overflow-y: auto; }
    .example-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .12s;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .example-item:hover { background: var(--surface2); }
    .example-item.active { background: var(--accent-glow); border-left: 3px solid var(--accent); }
    .example-item .item-id {
      font-size: .72rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
    .example-item .item-msg {
      font-size: .78rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .example-item .item-badges { display: flex; gap: 4px; align-items: center; }
    .pill {
      font-size: .65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 99px;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .pill.done     { background: var(--green-d);  color: var(--green); }
    .pill.pending  { background: var(--yellow-d); color: var(--yellow); }
    .pill.auto     { background: rgba(88,166,255,.12); color: var(--accent); }
    .pill.esc      { background: var(--red-d);    color: var(--red); }
    .pill.hard     { background: var(--purple-d); color: var(--purple); }
    .pill.easy     { background: rgba(63,185,80,.1); color: var(--green); }
    .pill.medium   { background: var(--yellow-d); color: var(--yellow); }

    /* ── MAIN CONTENT ───────────────────────────────────────────── */
    #main {
      overflow-y: auto;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── LOADING / EMPTY ────────────────────────────────────────── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      font-size: .9rem;
      color: var(--text-muted);
      gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CARD ───────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2 .icon { font-size: 1rem; }

    /* ── CUSTOMER MESSAGE ───────────────────────────────────────── */
    #msg-card { border-color: var(--border-l); }
    #msg-text {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--text);
      background: var(--surface2);
      padding: 16px 18px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }
    #msg-meta {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: .75rem;
      color: var(--text-dim);
    }
    #msg-meta span { display: flex; align-items: center; gap: 4px; }

    /* ── MODEL RECOMMENDATION ───────────────────────────────────── */
    #rec-card { background: var(--surface2); border-color: var(--border); }
    #rec-body {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .rec-item {
      flex: 1;
      min-width: 160px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .rec-item .label { font-size: .7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
    .rec-item .value { font-size: .9rem; font-weight: 600; color: var(--text); }
    .rec-item .value.auto  { color: var(--accent); }
    .rec-item .value.esc   { color: var(--red); }

    /* ── ANNOTATION FORM ────────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-label { font-size: .8rem; font-weight: 600; color: var(--text-muted); }

    /* Intent Grid */
    #intent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 8px;
    }
    .intent-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      text-align: left;
      transition: all .15s;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .intent-btn:hover { border-color: var(--accent); background: var(--accent-glow); }
    .intent-btn.selected {
      border-color: var(--accent);
      background: var(--accent-glow);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .intent-btn .iname { font-size: .82rem; font-weight: 600; }
    .intent-btn .idesc { font-size: .7rem; color: var(--text-muted); }

    /* Decision Buttons */
    #decision-btns { display: flex; gap: 12px; }
    .decision-btn {
      flex: 1;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 700;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .decision-btn:hover { border-color: var(--border-l); color: var(--text); }
    .decision-btn.selected-auto {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--accent);
    }
    .decision-btn.selected-esc {
      border-color: var(--red);
      background: var(--red-d);
      color: var(--red);
    }

    /* Text inputs */
    textarea, input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: .85rem;
      padding: 10px 12px;
      resize: vertical;
      transition: border-color .15s;
      width: 100%;
    }
    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ── SUBMIT ROW ─────────────────────────────────────────────── */
    #submit-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #btn-submit {
      background: linear-gradient(135deg, #58a6ff, #a371f7);
      color: #fff;
      font-size: .9rem;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      transition: filter .15s, transform .1s;
      letter-spacing: .02em;
    }
    #btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
    #btn-submit:active { transform: translateY(0); }
    #btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    #btn-skip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: .85rem;
      padding: 11px 18px;
      border-radius: 8px;
      transition: all .15s;
    }
    #btn-skip:hover { background: var(--surface2); color: var(--text); }
    #save-status {
      font-size: .8rem;
      color: var(--green);
      opacity: 0;
      transition: opacity .3s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #save-status.show { opacity: 1; }

    /* ── RIGHT PANEL — STATS ─────────────────────────────────────── */
    #right-panel {
      border-left: 1px solid var(--border);
      background: var(--surface);
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    #right-panel h3 {
      font-size: .8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .stat-ring-wrap { display: flex; justify-content: center; }
    svg#ring-chart { overflow: visible; }
    .stat-row { display: flex; justify-content: space-between; font-size: .78rem; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .stat-row .skey { color: var(--text-muted); }
    .stat-row .sval { font-weight: 600; color: var(--text); }
    .dist-bar-wrap { display: flex; flex-direction: column; gap: 6px; }
    .dist-bar-item { display: flex; flex-direction: column; gap: 2px; }
    .dist-bar-item .dname { font-size: .72rem; color: var(--text-muted); }
    .dist-bar-item .dtrack {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .dist-bar-item .dfill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #58a6ff, #a371f7);
      transition: width .4s ease;
    }
    .dist-bar-item .dcount { font-size: .7rem; color: var(--text-dim); text-align: right; }

    /* ── TOAST ───────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      background: var(--surface);
      border: 1px solid var(--green);
      color: var(--green);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { border-color: var(--red); color: var(--red); }

    /* ── EMPTY STATE ─────────────────────────────────────────────── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      gap: 12px;
      color: var(--text-muted);
      font-size: .9rem;
      text-align: center;
    }
    #empty-state .big { font-size: 3rem; }

    /* ── RESPONSIVE ──────────────────────────────────────────────── */
    @media (max-width: 1100px) {
      #app { grid-template-columns: 240px 1fr; }
      #right-panel { display: none; }
    }
    @media (max-width: 720px) {
      #app { grid-template-columns: 1fr; }
      #sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect width="20" height="20" rx="5" fill="#58a6ff"/>
      <path d="M5 10h10M10 5v10" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    Hiver AI Agent
    <span class="badge">ANNOTATION</span>
  </div>
  <div id="progress-bar-wrap">
    <div id="progress-bar"></div>
  </div>
  <div id="progress-label">0 / 200</div>
  <div id="header-actions">
    <button class="btn-small" onclick="filterExamples('all')">All</button>
    <button class="btn-small" onclick="filterExamples('pending')">Pending</button>
    <button class="btn-small accent" onclick="filterExamples('done')">Done</button>
  </div>
</header>

<!-- APP GRID -->
<div id="app">

  <!-- LEFT SIDEBAR -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <h3>Examples</h3>
      <span id="sidebar-count" style="font-size:.75rem;color:var(--text-dim)"></span>
    </div>
    <div id="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" data-filter="pending" onclick="setFilter('pending',this)">Pending</button>
      <button class="filter-btn" data-filter="done" onclick="setFilter('done',this)">Done</button>
    </div>
    <div id="example-list"></div>
  </aside>

  <!-- MAIN ANNOTATION AREA -->
  <main id="main">
    <div id="loading"><div class="spinner"></div> Loading golden set…</div>
  </main>

  <!-- RIGHT PANEL -->
  <aside id="right-panel">
    <h3>📊 Annotation Stats</h3>
    <div class="stat-ring-wrap">
      <svg id="ring-chart" width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="48" fill="none" stroke="#30363d" stroke-width="14"/>
        <circle id="ring-fill" cx="60" cy="60" r="48" fill="none"
                stroke="url(#rg)" stroke-width="14" stroke-linecap="round"
                stroke-dasharray="301.6" stroke-dashoffset="301.6"
                transform="rotate(-90 60 60)" style="transition:stroke-dashoffset .5s ease"/>
        <defs>
          <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#58a6ff"/>
            <stop offset="100%" stop-color="#a371f7"/>
          </linearGradient>
        </defs>
        <text x="60" y="56" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="700" font-family="Inter,sans-serif" id="ring-pct">0%</text>
        <text x="60" y="72" text-anchor="middle" fill="#8b949e" font-size="9" font-family="Inter,sans-serif">complete</text>
      </svg>
    </div>
    <div>
      <div class="stat-row"><span class="skey">Total Examples</span><span class="sval" id="stat-total">—</span></div>
      <div class="stat-row"><span class="skey">Human Done</span><span class="sval" id="stat-done" style="color:var(--green)">—</span></div>
      <div class="stat-row"><span class="skey">Remaining</span><span class="sval" id="stat-rem" style="color:var(--yellow)">—</span></div>
      <div class="stat-row"><span class="skey">Auto-Handle</span><span class="sval" id="stat-auto" style="color:var(--accent)">—</span></div>
      <div class="stat-row"><span class="skey">Escalate</span><span class="sval" id="stat-esc" style="color:var(--red)">—</span></div>
    </div>
    <h3>Intent Distribution</h3>
    <div class="dist-bar-wrap" id="dist-bars"></div>
  </aside>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
let examples = [];
let intents  = [];
let currentIdx = -1;
let currentFilter = 'all';

// Chosen annotation values (before submit)
let chosenIntent   = null;
let chosenDecision = null;

// ── BOOT ─────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const [exRes, intRes] = await Promise.all([
      fetch('/api/examples').then(r => r.json()),
      fetch('/api/intents').then(r => r.json()),
    ]);
    examples = exRes;
    intents  = intRes;
    renderSidebar();
    refreshStats();
    // Start on first pending or first example
    const firstPending = examples.findIndex(e => !e.annotated_by_human);
    loadExample(firstPending >= 0 ? firstPending : 0);
    document.getElementById('loading').style.display = 'none';
  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<span style="color:var(--red)">⚠ Failed to load: ${err.message}. Is the server running?</span>`;
  }
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  renderSidebar();
}

function filterExamples(f) {
  setFilter(f, document.querySelector(`.filter-btn[data-filter="${f}"]`));
}

function renderSidebar() {
  const list = document.getElementById('example-list');
  list.innerHTML = '';
  const visible = examples.filter(e => {
    if (currentFilter === 'pending') return !e.annotated_by_human;
    if (currentFilter === 'done')    return  e.annotated_by_human;
    return true;
  });
  document.getElementById('sidebar-count').textContent = `${visible.length}`;
  visible.forEach(ex => {
    const globalIdx = examples.indexOf(ex);
    const item = document.createElement('div');
    item.className = 'example-item' + (globalIdx === currentIdx ? ' active' : '');
    item.onclick = () => loadExample(globalIdx);
    const done = ex.annotated_by_human;
    const dec  = ex.gold_decision;
    item.innerHTML = `
      <div class="item-id">${ex.example_id}</div>
      <div class="item-msg">${escHtml(ex.customer_message)}</div>
      <div class="item-badges">
        <span class="pill ${done ? 'done' : 'pending'}">${done ? '✓ Done' : 'Pending'}</span>
        <span class="pill ${dec === 'AUTO_HANDLE' ? 'auto' : 'esc'}">${dec}</span>
        ${ex.difficulty ? `<span class="pill ${ex.difficulty}">${ex.difficulty}</span>` : ''}
      </div>
    `;
    list.appendChild(item);
  });
}

// ── LOAD EXAMPLE ─────────────────────────────────────────────────────────────
function loadExample(idx) {
  if (idx < 0 || idx >= examples.length) return;
  currentIdx = idx;
  const ex = examples[idx];

  // Reset chosen values to example's current gold labels
  chosenIntent   = ex.gold_intent;
  chosenDecision = ex.gold_decision;

  renderSidebar();
  updateProgress();

  const main = document.getElementById('main');
  main.innerHTML = buildExampleHTML(ex);

  // Bind intent buttons
  document.querySelectorAll('.intent-btn').forEach(btn => {
    if (btn.dataset.intent === chosenIntent) btn.classList.add('selected');
    btn.onclick = () => selectIntent(btn.dataset.intent);
  });

  // Bind decision buttons
  const btnAuto = document.getElementById('dbtn-auto');
  const btnEsc  = document.getElementById('dbtn-esc');
  applyDecisionStyle(chosenDecision, btnAuto, btnEsc);
  btnAuto.onclick = () => selectDecision('AUTO_HANDLE', btnAuto, btnEsc);
  btnEsc.onclick  = () => selectDecision('ESCALATE',    btnAuto, btnEsc);

  // Nav buttons
  const prevBtn = document.getElementById('btn-prev');
  const nextBtn = document.getElementById('btn-next');
  if (prevBtn) prevBtn.onclick = () => loadExample(idx - 1);
  if (nextBtn) nextBtn.onclick = () => loadExample(idx + 1);
}

function buildExampleHTML(ex) {
  const humanDone = ex.annotated_by_human;
  return `
  <!-- NAV ROW -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
    <button class="btn-small" id="btn-prev" ${currentIdx === 0 ? 'disabled' : ''}>← Prev</button>
    <span style="font-size:.78rem;color:var(--text-dim);flex:1;text-align:center">
      ${currentIdx + 1} / ${examples.length}
    </span>
    <button class="btn-small" id="btn-next" ${currentIdx === examples.length-1 ? 'disabled' : ''}>Next →</button>
  </div>

  <!-- CUSTOMER MESSAGE -->
  <div class="card" id="msg-card">
    <h2><span class="icon">💬</span> Customer Message
      ${humanDone ? '<span class="pill done" style="margin-left:auto">✓ Human Labelled</span>' : '<span class="pill pending" style="margin-left:auto">Pending</span>'}
    </h2>
    <div id="msg-text">${escHtml(ex.customer_message)}</div>
    <div id="msg-meta">
      <span>🔖 ID: <strong>${ex.example_id}</strong></span>
      <span>📋 Conv: ${ex.conversation_id}</span>
      <span>🏷 Brand: @${ex.brand}</span>
      <span>📊 Difficulty: <strong>${ex.difficulty || '—'}</strong></span>
      <span>🌐 Context: ${escHtml(ex.conversation_context || '—')}</span>
    </div>
  </div>

  <!-- MODEL RECOMMENDATION -->
  <div class="card" id="rec-card">
    <h2><span class="icon">🤖</span> Model Recommendation (for reference only)</h2>
    <div id="rec-body">
      <div class="rec-item">
        <div class="label">Suggested Intent</div>
        <div class="value">${ex.model_recommended_intent || '—'}</div>
      </div>
      <div class="rec-item">
        <div class="label">Suggested Decision</div>
        <div class="value ${(ex.model_recommended_decision === 'AUTO_HANDLE') ? 'auto' : 'esc'}">${ex.model_recommended_decision || '—'}</div>
      </div>
    </div>
  </div>

  <!-- INTENT SELECTION -->
  <div class="card">
    <h2><span class="icon">🎯</span> Step 1 — Select Intent</h2>
    <div class="form-group">
      <div id="intent-grid">
        ${intents.map(i => `
          <button class="intent-btn" data-intent="${i.name}">
            <span class="iname">${i.name}</span>
            <span class="idesc">${i.description}</span>
          </button>
        `).join('')}
      </div>
    </div>
  </div>

  <!-- DECISION SELECTION -->
  <div class="card">
    <h2><span class="icon">⚡</span> Step 2 — Routing Decision</h2>
    <div id="decision-btns">
      <button class="decision-btn" id="dbtn-auto">🤖 AUTO_HANDLE</button>
      <button class="decision-btn" id="dbtn-esc">🚨 ESCALATE</button>
    </div>
    <div id="esc-reason-wrap" style="margin-top:12px;display:${ex.gold_decision==='ESCALATE' ? 'block' : 'none'}">
      <label class="form-label" style="margin-bottom:6px;display:block">Escalation Reason</label>
      <input type="text" id="esc-reason"
             value="${escAttr(ex.escalation_reason || 'Query requires human agent intervention or contains ambiguity.')}"
             placeholder="Why should this be escalated?" />
    </div>
  </div>

  <!-- ANNOTATION NOTE -->
  <div class="card">
    <h2><span class="icon">📝</span> Step 3 — Annotation Note (optional)</h2>
    <textarea id="annotation-note" rows="2" placeholder="Any notes about this annotation decision…">${escHtml(ex.annotation_note || '')}</textarea>
  </div>

  <!-- SUBMIT ROW -->
  <div id="submit-row">
    <button id="btn-submit" onclick="submitAnnotation()">✓ Save Human Label</button>
    <button id="btn-skip" onclick="skipToNext()">Skip →</button>
    <span id="save-status">✓ Saved!</span>
  </div>
  `;
}

// ── INTENT SELECTION ──────────────────────────────────────────────────────────
function selectIntent(intentName) {
  chosenIntent = intentName;
  document.querySelectorAll('.intent-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.intent === intentName);
  });
}

// ── DECISION SELECTION ────────────────────────────────────────────────────────
function selectDecision(decision, btnAuto, btnEsc) {
  chosenDecision = decision;
  applyDecisionStyle(decision, btnAuto, btnEsc);
  const escWrap = document.getElementById('esc-reason-wrap');
  if (escWrap) escWrap.style.display = decision === 'ESCALATE' ? 'block' : 'none';
}

function applyDecisionStyle(decision, btnAuto, btnEsc) {
  btnAuto.className = 'decision-btn' + (decision === 'AUTO_HANDLE' ? ' selected-auto' : '');
  btnEsc.className  = 'decision-btn' + (decision === 'ESCALATE'    ? ' selected-esc'  : '');
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────
async function submitAnnotation() {
  const ex = examples[currentIdx];
  if (!chosenIntent || !chosenDecision) {
    showToast('Please select an intent and decision first.', true);
    return;
  }
  const escReasonEl = document.getElementById('esc-reason');
  const noteEl      = document.getElementById('annotation-note');
  const payload = {
    example_id:       ex.example_id,
    gold_intent:      chosenIntent,
    gold_decision:    chosenDecision,
    escalation_reason: (chosenDecision === 'ESCALATE' && escReasonEl)
                         ? escReasonEl.value.trim() : null,
    annotation_note:  noteEl ? noteEl.value.trim() : '',
  };
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Save failed');
    // Update local state
    ex.gold_intent       = chosenIntent;
    ex.gold_decision     = chosenDecision;
    ex.escalation_reason = payload.escalation_reason;
    ex.annotation_note   = payload.annotation_note;
    ex.annotated_by_human = true;
    showToast(`✓ ${ex.example_id} saved! (${data.human_done}/${data.total} done)`);
    updateProgress();
    renderSidebar();
    // Show saved status
    const ss = document.getElementById('save-status');
    if (ss) { ss.classList.add('show'); setTimeout(() => ss.classList.remove('show'), 2000); }
    // Auto-advance to next pending
    setTimeout(() => {
      const nextPending = examples.findIndex((e, i) => i > currentIdx && !e.annotated_by_human);
      if (nextPending >= 0) loadExample(nextPending);
      else {
        const anyPending = examples.findIndex(e => !e.annotated_by_human);
        if (anyPending >= 0) loadExample(anyPending);
      }
    }, 600);
    refreshStats();
  } catch (err) {
    showToast('Error: ' + err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '✓ Save Human Label';
  }
}

function skipToNext() {
  const next = examples.findIndex((e, i) => i > currentIdx && !e.annotated_by_human);
  if (next >= 0) loadExample(next);
  else loadExample(Math.min(currentIdx + 1, examples.length - 1));
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function updateProgress() {
  const done  = examples.filter(e => e.annotated_by_human).length;
  const total = examples.length;
  const pct   = total ? (done / total * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done} / ${total}`;
}

// ── STATS ─────────────────────────────────────────────────────────────────────
async function refreshStats() {
  try {
    const s = await fetch('/api/stats').then(r => r.json());
    document.getElementById('stat-total').textContent = s.total;
    document.getElementById('stat-done').textContent  = s.human_done;
    document.getElementById('stat-rem').textContent   = s.remaining;
    document.getElementById('stat-auto').textContent  = s.decision_distribution['AUTO_HANDLE'] || 0;
    document.getElementById('stat-esc').textContent   = s.decision_distribution['ESCALATE'] || 0;
    // Ring chart
    const pct = s.total ? s.human_done / s.total : 0;
    const circ = 301.6;
    document.getElementById('ring-fill').style.strokeDashoffset = circ * (1 - pct);
    document.getElementById('ring-pct').textContent = Math.round(pct * 100) + '%';
    // Dist bars
    renderDistBars(s.intent_distribution, s.human_done);
  } catch (e) { /* stats panel optional */ }
}

function renderDistBars(dist, total) {
  const wrap = document.getElementById('dist-bars');
  if (!wrap) return;
  wrap.innerHTML = '';
  const sorted = Object.entries(dist).sort((a,b) => b[1]-a[1]);
  sorted.forEach(([name, count]) => {
    const pct = total > 0 ? count / total * 100 : 0;
    const d = document.createElement('div');
    d.className = 'dist-bar-item';
    d.innerHTML = `
      <div class="dname">${name}</div>
      <div class="dtrack"><div class="dfill" style="width:${pct}%"></div></div>
      <div class="dcount">${count} (${pct.toFixed(0)}%)</div>
    `;
    wrap.appendChild(d);
  });
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return escHtml(s); }

// ── KEYBOARD SHORTCUTS ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  // Ignore when typing in textarea/input
  if (['TEXTAREA','INPUT'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'n') skipToNext();
  if (e.key === 'ArrowLeft'  || e.key === 'p') loadExample(currentIdx - 1);
  if (e.key === 'Enter' && !e.shiftKey) submitAnnotation();
  if (e.key === 'a') selectDecision('AUTO_HANDLE',
    document.getElementById('dbtn-auto'), document.getElementById('dbtn-esc'));
  if (e.key === 'e') selectDecision('ESCALATE',
    document.getElementById('dbtn-auto'), document.getElementById('dbtn-esc'));
  // Number keys 1-9 for intent
  const num = parseInt(e.key);
  if (num >= 1 && num <= intents.length) selectIntent(intents[num - 1].name);
});

// ── START ─────────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
